app: nami
service: nami
useDotenv: true
frameworkVersion: "3"

provider:
    name: aws
    runtime: nodejs20.x
    region: ap-southeast-1
    stage: ${opt:stage,'error1'}
    timeout: 10

functions:
    api:
        handler: index.appHandler
        events:
            - httpApi: "*"

plugins:
    - serverless-offline
    - serverless-dotenv-plugin
    - serverless-offline-scheduler

custom:
    dotenv:
        basePath: ./config/
        dotenvConfig:
            path: ./config/.env.${opt:stage, 'error2'}

package:
    excludeDevDependencies: true
    exclude:
        - note.md
        - README.md
